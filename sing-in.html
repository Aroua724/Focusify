<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="Author" content="AROUA DJAHNIT">
    <meta name="description"
        content="a personal productivity and learning web app designed to boost focus, manage daily tasks, and master study sessions.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>sing in</title>
</head>

<body>
    <link rel="stylesheet" href="../css/sing-in.css">
    <div class="login-container">
        <div class="login-card">
            <h2>Create Account on <span class="brand">Focusify</span></h2>
            <p class="subtitle">Join us to start your focus journey</p>

            <form id="signin-form">
                <div class="input-group">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" placeholder="Enter your first name" required>
                </div>

                <div class="input-group">
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" placeholder="Enter your last name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <p class="switch-text">Already have an account? <a href="focucify.html">Back to Home</a></p>
        </div>
    </div>
    <script src="../js/sing-in.js"></script>
</body>
